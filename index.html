<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>–Т—Л–±–Њ—А –Ї–∞—А—В –Ґ–∞—А–Њ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .count {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ffd700;
            font-weight: bold;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #4a0080 0%, #6d28d9 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            border: 3px solid transparent;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .card.selected {
            border-color: #ffd700;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #4a0080;
            transform: scale(1.1);
        }

        .card.selected::after {
            content: 'вЬУ';
            position: absolute;
            top: -5px;
            right: -5px;
            background: #4a0080;
            color: #ffd700;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .card-icon {
            font-size: 40px;
            opacity: 0.8;
        }

        .selected .card-icon {
            opacity: 1;
        }

        .continue-btn {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
            transition: all 0.3s ease;
            display: none;
        }

        .continue-btn:hover {
            background: linear-gradient(135deg, #0056b3 0%, #004085 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.6);
        }

        .continue-btn.show {
            display: inline-block;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .debug {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 300px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="debug" id="debug"></div>
    
    <div class="container">
        <div class="header">
            <h1>рЯФЃ –Т—Л–±–µ—А–Є—В–µ 3 –Ї–∞—А—В—Л рЯФЃ</h1>
            <div class="count" id="count">–Т—Л–±—А–∞–љ–Њ: 0 / 3</div>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>

        <button class="continue-btn" id="continueBtn">вЬ® –Я—А–Њ–і–Њ–ї–ґ–Є—В—М вЬ®</button>
    </div>

    <script>
        // –Ш–љ–Є—Ж–Є–∞–ї–Є–Ј–∞—Ж–Є—П Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // –Ф–∞–љ–љ—Л–µ –Ї–∞—А—В
        const tarotCards = [
            { slug: 'the-fool', name: '–®—Г—В', icon: 'рЯГП' },
            { slug: 'the-magician', name: '–Ь–∞–≥', icon: 'рЯО©' },
            { slug: 'the-high-priestess', name: '–Т–µ—А—Е–Њ–≤–љ–∞—П –Ц—А–Є—Ж–∞', icon: 'рЯМЩ' },
            { slug: 'the-empress', name: '–Ш–Љ–њ–µ—А–∞—В—А–Є—Ж–∞', icon: 'рЯСС' },
            { slug: 'the-emperor', name: '–Ш–Љ–њ–µ—А–∞—В–Њ—А', icon: 'вЪ°' },
            { slug: 'the-hierophant', name: '–Ш–µ—А–Њ—Д–∞–љ—В', icon: 'вЫ™' },
            { slug: 'the-lovers', name: '–Т–ї—О–±–ї–µ–љ–љ—Л–µ', icon: 'рЯТХ' },
            { slug: 'the-chariot', name: '–Ъ–Њ–ї–µ—Б–љ–Є—Ж–∞', icon: 'рЯПЫпЄП' },
            { slug: 'strength', name: '–°–Є–ї–∞', icon: 'рЯ¶Б' },
            { slug: 'the-hermit', name: '–Ю—В—И–µ–ї—М–љ–Є–Ї', icon: 'рЯХѓпЄП' },
            { slug: 'wheel-of-fortune', name: '–Ъ–Њ–ї–µ—Б–Њ –§–Њ—А—В—Г–љ—Л', icon: 'рЯО°' },
            { slug: 'justice', name: '–°–њ—А–∞–≤–µ–і–ї–Є–≤–Њ—Б—В—М', icon: 'вЪЦпЄП' }
        ];

        let selectedCards = [];
        const MAX_CARDS = 3;

        // –≠–ї–µ–Љ–µ–љ—В—Л DOM
        const cardsGrid = document.getElementById('cardsGrid');
        const countElement = document.getElementById('count');
        const continueBtn = document.getElementById('continueBtn');
        const debugElement = document.getElementById('debug');

        // –§—Г–љ–Ї—Ж–Є—П –ї–Њ–≥–Є—А–Њ–≤–∞–љ–Є—П
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            debugElement.innerHTML += `[${timestamp}] ${message}<br>`;
            debugElement.scrollTop = debugElement.scrollHeight;
            console.log(message);
        }

        // –°–Њ–Ј–і–∞–љ–Є–µ –Ї–∞—А—В
        function createCards() {
            cardsGrid.innerHTML = '';
            
            tarotCards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.dataset.slug = card.slug;
                cardElement.innerHTML = `<div class="card-icon">${card.icon}</div>`;
                
                cardElement.addEventListener('click', () => {
                    toggleCard(cardElement, card);
                });
                
                cardsGrid.appendChild(cardElement);
            });
        }

        // –Я–µ—А–µ–Ї–ї—О—З–µ–љ–Є–µ –≤—Л–±–Њ—А–∞ –Ї–∞—А—В—Л
        function toggleCard(cardElement, card) {
            const isSelected = cardElement.classList.contains('selected');
            
            if (isSelected) {
                // –£–±–Є—А–∞–µ–Љ –Є–Ј –≤—Л–±—А–∞–љ–љ—Л—Е
                cardElement.classList.remove('selected');
                selectedCards = selectedCards.filter(c => c.slug !== card.slug);
                log(`–Ъ–∞—А—В–∞ "${card.name}" —Г–±—А–∞–љ–∞ –Є–Ј –≤—Л–±–Њ—А–∞`);
            } else {
                // –Ф–Њ–±–∞–≤–ї—П–µ–Љ –≤ –≤—Л–±—А–∞–љ–љ—Л–µ (–Љ–∞–Ї—Б–Є–Љ—Г–Љ 3)
                if (selectedCards.length >= MAX_CARDS) {
                    log(`–Ь–∞–Ї—Б–Є–Љ—Г–Љ ${MAX_CARDS} –Ї–∞—А—В`);
                    return;
                }
                
                cardElement.classList.add('selected');
                selectedCards.push({
                    slug: card.slug,
                    name: card.name,
                    reversed: Math.random() < 0.3 // 30% —И–∞–љ—Б –њ–µ—А–µ–≤–µ—А–љ—Г—В–Њ–є –Ї–∞—А—В—Л
                });
                log(`–Ъ–∞—А—В–∞ "${card.name}" –і–Њ–±–∞–≤–ї–µ–љ–∞ –≤ –≤—Л–±–Њ—А`);
            }
            
            updateUI();
        }

        // –Ю–±–љ–Њ–≤–ї–µ–љ–Є–µ –Є–љ—В–µ—А—Д–µ–є—Б–∞
        function updateUI() {
            countElement.textContent = `–Т—Л–±—А–∞–љ–Њ: ${selectedCards.length} / ${MAX_CARDS}`;
            
            if (selectedCards.length === MAX_CARDS) {
                continueBtn.classList.add('show');
                log('–Ъ–љ–Њ–њ–Ї–∞ "–Я—А–Њ–і–Њ–ї–ґ–Є—В—М" –њ–Њ–Ї–∞–Ј–∞–љ–∞');
            } else {
                continueBtn.classList.remove('show');
            }
        }

        // –Ю–±—А–∞–±–Њ—В—З–Є–Ї –Ї–љ–Њ–њ–Ї–Є "–Я—А–Њ–і–Њ–ї–ґ–Є—В—М"
        continueBtn.addEventListener('click', () => {
            if (selectedCards.length !== MAX_CARDS) {
                log('–Ю—И–Є–±–Ї–∞: –≤—Л–±—А–∞–љ–Њ –љ–µ 3 –Ї–∞—А—В—Л');
                return;
            }
            
            log(`–Ю—В–њ—А–∞–≤–Ї–∞ –і–∞–љ–љ—Л—Е: ${JSON.stringify(selectedCards)}`);
            
            try {
                // –Ю—В–њ—А–∞–≤–ї—П–µ–Љ –і–∞–љ–љ—Л–µ
                const data = {
                    cards: selectedCards.map(card => ({
                        slug: card.slug,
                        reversed: card.reversed
                    }))
                };
                
                tg.sendData(JSON.stringify(data));
                log('вЬЕ –Ф–∞–љ–љ—Л–µ –Њ—В–њ—А–∞–≤–ї–µ–љ—Л —Г—Б–њ–µ—И–љ–Њ');
                
                // –Ч–∞–Ї—А—Л–≤–∞–µ–Љ WebApp
                setTimeout(() => {
                    tg.close();
                }, 1000);
                
            } catch (error) {
                log(`вЭМ –Ю—И–Є–±–Ї–∞ –Њ—В–њ—А–∞–≤–Ї–Є: ${error.message}`);
                
                // Fallback: –њ–Њ–Ї–∞–Ј—Л–≤–∞–µ–Љ alert
                tg.showAlert(
                    `–Т—Л–±—А–∞–љ—Л –Ї–∞—А—В—Л: ${selectedCards.map(c => c.name).join(', ')}\n\n–°–Ї–Њ–њ–Є—А—Г–є—В–µ –Є –Њ—В–њ—А–∞–≤—М—В–µ –±–Њ—В—Г.`,
                    () => {
                        setTimeout(() => tg.close(), 2000);
                    }
                );
            }
        });

        // –Ш–љ–Є—Ж–Є–∞–ї–Є–Ј–∞—Ж–Є—П
        log('WebApp –Є–љ–Є—Ж–Є–∞–ї–Є–Ј–Є—А–Њ–≤–∞–љ');
        createCards();
        updateUI();
        
        // –°–Ї—А—Л–≤–∞–µ–Љ MainButton
        if (tg.MainButton) {
            tg.MainButton.hide();
        }
    </script>
</body>
</html>
