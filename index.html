<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор карт Таро</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .count {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ffd700;
            font-weight: bold;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #4a0080 0%, #6d28d9 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            border: 3px solid transparent;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .card.selected {
            border-color: #ffd700;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #4a0080;
            transform: scale(1.1);
        }

        .card.selected::after {
            content: '✓';
            position: absolute;
            top: -5px;
            right: -5px;
            background: #4a0080;
            color: #ffd700;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .card-icon {
            font-size: 40px;
            opacity: 0.8;
        }

        .selected .card-icon {
            opacity: 1;
        }

        .continue-btn {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
            transition: all 0.3s ease;
            display: none;
        }

        .continue-btn:hover {
            background: linear-gradient(135deg, #0056b3 0%, #004085 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.6);
        }

        .continue-btn.show {
            display: inline-block;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .debug {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 300px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="debug" id="debug"></div>
    
    <div class="container">
        <div class="header">
            <h1>🔮 Выберите 3 карты 🔮</h1>
            <div class="count" id="count">Выбрано: 0 / 3</div>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>

        <button class="continue-btn" id="continueBtn">✨ Продолжить ✨</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Данные карт
        const tarotCards = [
            { slug: 'the-fool', name: 'Шут', icon: '🃏' },
            { slug: 'the-magician', name: 'Маг', icon: '🎩' },
            { slug: 'the-high-priestess', name: 'Верховная Жрица', icon: '🌙' },
            { slug: 'the-empress', name: 'Императрица', icon: '👑' },
            { slug: 'the-emperor', name: 'Император', icon: '⚡' },
            { slug: 'the-hierophant', name: 'Иерофант', icon: '⛪' },
            { slug: 'the-lovers', name: 'Влюбленные', icon: '💕' },
            { slug: 'the-chariot', name: 'Колесница', icon: '🏛️' },
            { slug: 'strength', name: 'Сила', icon: '🦁' },
            { slug: 'the-hermit', name: 'Отшельник', icon: '🕯️' },
            { slug: 'wheel-of-fortune', name: 'Колесо Фортуны', icon: '🎡' },
            { slug: 'justice', name: 'Справедливость', icon: '⚖️' }
        ];

        let selectedCards = [];
        const MAX_CARDS = 3;

        // Элементы DOM
        const cardsGrid = document.getElementById('cardsGrid');
        const countElement = document.getElementById('count');
        const continueBtn = document.getElementById('continueBtn');
        const debugElement = document.getElementById('debug');

        // Функция логирования
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            debugElement.innerHTML += `[${timestamp}] ${message}<br>`;
            debugElement.scrollTop = debugElement.scrollHeight;
            console.log(message);
        }

        // Создание карт
        function createCards() {
            cardsGrid.innerHTML = '';
            
            tarotCards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.dataset.slug = card.slug;
                cardElement.innerHTML = `<div class="card-icon">${card.icon}</div>`;
                
                cardElement.addEventListener('click', () => {
                    toggleCard(cardElement, card);
                });
                
                cardsGrid.appendChild(cardElement);
            });
        }

        // Переключение выбора карты
        function toggleCard(cardElement, card) {
            const isSelected = cardElement.classList.contains('selected');
            
            if (isSelected) {
                // Убираем из выбранных
                cardElement.classList.remove('selected');
                selectedCards = selectedCards.filter(c => c.slug !== card.slug);
                log(`Карта "${card.name}" убрана из выбора`);
            } else {
                // Добавляем в выбранные (максимум 3)
                if (selectedCards.length >= MAX_CARDS) {
                    log(`Максимум ${MAX_CARDS} карт`);
                    return;
                }
                
                cardElement.classList.add('selected');
                selectedCards.push({
                    slug: card.slug,
                    name: card.name,
                    reversed: Math.random() < 0.3 // 30% шанс перевернутой карты
                });
                log(`Карта "${card.name}" добавлена в выбор`);
            }
            
            updateUI();
        }

        // Обновление интерфейса
        function updateUI() {
            countElement.textContent = `Выбрано: ${selectedCards.length} / ${MAX_CARDS}`;
            
            if (selectedCards.length === MAX_CARDS) {
                continueBtn.classList.add('show');
                log('Кнопка "Продолжить" показана');
            } else {
                continueBtn.classList.remove('show');
            }
        }

        // Обработчик кнопки "Продолжить"
        continueBtn.addEventListener('click', () => {
            if (selectedCards.length !== MAX_CARDS) {
                log('Ошибка: выбрано не 3 карты');
                return;
            }
            
            log(`Отправка данных: ${JSON.stringify(selectedCards)}`);
            
            try {
                // Отправляем данные
                const data = {
                    cards: selectedCards.map(card => ({
                        slug: card.slug,
                        reversed: card.reversed
                    }))
                };
                
                tg.sendData(JSON.stringify(data));
                log('✅ Данные отправлены успешно');
                
                // Закрываем WebApp
                setTimeout(() => {
                    tg.close();
                }, 1000);
                
            } catch (error) {
                log(`❌ Ошибка отправки: ${error.message}`);
                
                // Fallback: показываем alert
                tg.showAlert(
                    `Выбраны карты: ${selectedCards.map(c => c.name).join(', ')}\n\nСкопируйте и отправьте боту.`,
                    () => {
                        setTimeout(() => tg.close(), 2000);
                    }
                );
            }
        });

        // Инициализация
        log('WebApp инициализирован');
        createCards();
        updateUI();
        
        // Скрываем MainButton
        if (tg.MainButton) {
            tg.MainButton.hide();
        }
    </script>
</body>
</html>
